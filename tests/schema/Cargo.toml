[package]
name = "dj-assistant-schema-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately depends only on rusqlite (no Tauri). This lets the SQLite schema
# and query contracts be verified on any host without pulling in the Tauri /
# WebView2 native stack, which cannot be linked by every Windows toolchain.
[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
# The Tauri-free core, for the shared query builder and the library summary
# statements. It has no default features, so it pulls in no database code.
dj-assistant-core = { path = "../../crates/core" }
# The undo snapshots are JSON columns; the bulk-write contract reads them back.
serde_json = "1.0"

[lib]
path = "src/lib.rs"
