[package]
name = "dj-assistant-analysis"
version = "0.1.0"
edition = "2021"
description = "Audio decoding (Symphonia), DSP normalization, and ONNX Runtime inference engine"
publish = false

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "wav", "aiff", "isomp4", "aac", "pcm", "opt-simd"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std", "ndarray"] }
sha2 = "0.10"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Spectral-flux onset detection for the deterministic BPM/beat-grid path.
rustfft = "6"
num-complex = "0.4"
# EBU R128 (BS.1770-4) loudness: K-weighting, gated integrated loudness,
# loudness range, and true peak (T1.1.7).
ebur128 = "0.1"

[dev-dependencies]
tempfile = "3.17"
serde_json = "1.0"
