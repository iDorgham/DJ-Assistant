[package]
name = "dj-assistant-desktop"
version = "0.1.0"
description = "Desktop-first DJ preparation app"
authors = ["DJ Assistant Team"]
edition = "2021"

[lib]
name = "dj_assistant_lib"
# NOTE: `cdylib`/`staticlib` are only required for Tauri mobile (iOS/Android) targets.
# They are omitted here because MinGW's `ld` cannot link this crate's export surface
# as a DLL on x86_64-pc-windows-gnu (fails with "export ordinal too large").
# Re-add ["staticlib", "cdylib", "rlib"] when a mobile target is introduced.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
# Tauri-free core logic (discovery, fingerprinting, metadata). Kept as a separate
# crate so it stays unit-testable without linking WebView2.
dj-assistant-core = { path = "../../../crates/core" }
# Local ONNX analysis engine: decode + deterministic analyzers (bpn/key/phrase/vocal/loudness)
# and the composite analysis_version. Wired in for the T1.2.x job queue.
dj-assistant-analysis = { path = "../../../crates/analysis" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
# NOTE: `blake3`, `audiotags` and `walkdir` are intentionally absent here — that
# logic now lives in dj-assistant-core. Re-add only if this crate needs them directly.
uuid = { version = "1.10", features = ["v4", "serde"] }
# Base64-encodes cached cover art for the `get_artwork` command's data URL.
base64 = "0.23"
# Online enrichment + provider matching (TE.1 / TX.2): metadata-only HTTPS.
# native-tls = OS TLS (schannel / Security.framework / openssl) with no extra
# build tools; CI already installs libssl-dev on ubuntu. Only JSON APIs and
# cover-art images are fetched — audio preview/stream URLs are never touched.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
# Async timers for provider rate limiting (MusicBrainz: max ~1 req/s).
tokio = { version = "1", features = ["time"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
