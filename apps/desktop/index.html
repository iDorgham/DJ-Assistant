<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DJ Assistant</title>
    <meta
      name="description"
      content="Local-first DJ prep tool — import, analyze, and tag your library, arrange sets with cues, grids, and exports for rekordbox, Serato, or CDJ. Non-destructive and offline by default."

    <!-- IBM Plex fonts for IBM Carbon Design System -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DJ Assistant" />
    <meta
      property="og:description"
      content="Local-first DJ prep tool — import, analyze, and tag your library, arrange sets with cues, grids, and exports for rekordbox, Serato, or CDJ. Non-destructive and offline by default."
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/iDorgham/dj-assistant/main/assets/social-preview.png"

    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DJ Assistant" />

      name="twitter:description"
      content="Local-first DJ prep tool — import, analyze, and tag your library, arrange sets with cues, grids, and exports for rekordbox, Serato, or CDJ. Non-destructive and offline by default."
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/iDorgham/dj-assistant/main/assets/social-preview.png"
    />
