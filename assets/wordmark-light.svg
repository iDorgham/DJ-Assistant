<svg xmlns="http://www.w3.org/2000/svg" width="364" height="80" viewBox="0 0 364 80" role="img" aria-label="DJ Assistant">
  <title>DJ Assistant</title>
  <defs>
    <linearGradient id="wmLightTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEF6"/>
    </linearGradient>
    <linearGradient id="wmLightBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE3EE"/>
      <stop offset="1" stop-color="#C4CFE0"/>
    </linearGradient>
    <linearGradient id="wmLightEq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="wmLightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="glowWide"/>
      <feComponentTransfer in="glowWide" result="glowSoft">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="glowTight"/>
      <feMerge>
        <feMergeNode in="glowSoft"/>
        <feMergeNode in="glowTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(8 8) scale(0.5)">
    <rect x="1.5" y="1.5" width="125" height="125" rx="30" fill="url(#wmLightTile)"/>
    <g fill="url(#wmLightEq)" filter="url(#wmLightGlow)">
      <rect x="18" y="51" width="8" height="26" rx="4"/>
      <rect x="32" y="41" width="8" height="46" rx="4"/>
      <rect x="46" y="30" width="8" height="68" rx="4"/>
      <rect x="60" y="20" width="8" height="88" rx="4"/>
      <rect x="74" y="30" width="8" height="68" rx="4"/>
      <rect x="88" y="41" width="8" height="46" rx="4"/>
      <rect x="102" y="51" width="8" height="26" rx="4"/>
    </g>
    <rect x="1.5" y="1.5" width="125" height="125" rx="30" fill="none" stroke="url(#wmLightBorder)" stroke-width="3"/>
  </g>
  <text x="88" y="53"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="38" font-weight="700" letter-spacing="-1"
        textLength="252" lengthAdjust="spacing"
        fill="#0F1117">DJ Assistant</text>
</svg>
