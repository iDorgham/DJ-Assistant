<svg xmlns="http://www.w3.org/2000/svg" width="364" height="80" viewBox="0 0 364 80" role="img" aria-label="DJ Assistant">
  <title>DJ Assistant</title>
  <defs>
    <linearGradient id="wmLightTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEF6"/>
    </linearGradient>
    <linearGradient id="wmLightBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE3EE"/>
      <stop offset="1" stop-color="#C4CFE0"/>
    </linearGradient>
    <linearGradient id="wmLightFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F7FB"/>
    </linearGradient>
    <linearGradient id="wmLightPlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="wmLightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="glowWide"/>
      <feComponentTransfer in="glowWide" result="glowSoft">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glowSoft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="wmLightClip">
      <rect x="8" y="8" width="112" height="112" rx="26"/>
    </clipPath>
  </defs>
  <g transform="translate(8 8) scale(0.5)">
    <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#wmLightTile)"/>
    <g clip-path="url(#wmLightClip)">
      <rect x="42" y="24" width="44" height="20" rx="9" fill="#DCE3EE"/>
      <rect x="33" y="36" width="62" height="26" rx="10" fill="#C4CFE0"/>
      <rect x="24" y="50" width="80" height="56" rx="12" fill="url(#wmLightFront)" stroke="#C4CFE0" stroke-width="1.5"/>
      <path d="M56 69 L56 87 Q56 91 59.55 89.16 L77.45 79.84 Q81 78 77.45 76.16 L59.55 66.84 Q56 65 56 69 Z"
            fill="url(#wmLightPlay)" filter="url(#wmLightGlow)"/>
    </g>
    <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="url(#wmLightBorder)" stroke-width="2.5"/>
  </g>
  <text x="88" y="53"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="38" font-weight="700" letter-spacing="-1"
        textLength="252" lengthAdjust="spacing"
        fill="#0F1117">DJ Assistant</text>
</svg>