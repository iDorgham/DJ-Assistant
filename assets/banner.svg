<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="DJ Assistant — turn a music library into a performance-ready DJ set">
  <title>DJ Assistant</title>
  <defs>
    <linearGradient id="bnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="1" stop-color="#161A24"/>
    </linearGradient>
    <radialGradient id="bnRadialA" cx="0.06" cy="0" r="0.85">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bnRadialB" cx="0.98" cy="1" r="0.75">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bnBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3040"/>
      <stop offset="1" stop-color="#171B25"/>
    </linearGradient>
    <linearGradient id="bnTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171B25"/>
      <stop offset="1" stop-color="#0A0C11"/>
    </linearGradient>
    <linearGradient id="bnSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bnTileBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E344A"/>
      <stop offset="1" stop-color="#1A1F2B"/>
    </linearGradient>
    <linearGradient id="bnFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3145"/>
      <stop offset="1" stop-color="#1A1F2B"/>
    </linearGradient>
    <linearGradient id="bnEq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CE1FF"/>
      <stop offset="1" stop-color="#0090FF"/>
    </linearGradient>
    <linearGradient id="bnFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="bnMotifMask">
      <rect x="880" y="0" width="300" height="320" fill="url(#bnFade)"/>
    </mask>
    <filter id="bnGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="glowWide"/>
      <feComponentTransfer in="glowWide" result="glowSoft">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="glowTight"/>
      <feMerge>
        <feMergeNode in="glowSoft"/>
        <feMergeNode in="glowTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="bnTileClip">
      <rect x="8" y="8" width="112" height="112" rx="26"/>
    </clipPath>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bnBg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#bnRadialA)"/>
  <rect width="1280" height="320" rx="24" fill="url(#bnRadialB)"/>

  <!-- Right motif: a faint oversized Stack, fading toward the edges -->
  <g opacity="0.18" mask="url(#bnMotifMask)">
    <g transform="translate(838 -6) scale(3)">
      <rect x="42" y="24" width="44" height="20" rx="9" fill="none" stroke="url(#bnEq)" stroke-width="0.8"/>
      <rect x="33" y="36" width="62" height="26" rx="10" fill="none" stroke="url(#bnEq)" stroke-width="0.8"/>
      <rect x="24" y="50" width="80" height="56" rx="12" fill="none" stroke="url(#bnEq)" stroke-width="0.8"/>
      <path d="M56 69 L56 87 Q56 91 59.55 89.16 L77.45 79.84 Q81 78 77.45 76.16 L59.55 66.84 Q56 65 56 69 Z" fill="url(#bnEq)"/>
    </g>
  </g>

  <!-- Left lockup: The Stack app tile -->
  <g transform="translate(64 112) scale(0.75)">
    <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bnTile)"/>
    <rect x="8" y="8" width="112" height="112" fill="url(#bnSheen)" clip-path="url(#bnTileClip)"/>
    <g clip-path="url(#bnTileClip)">
      <rect x="42" y="24" width="44" height="20" rx="9" fill="#232939"/>
      <rect x="33" y="36" width="62" height="26" rx="10" fill="#2E344A"/>
      <rect x="24" y="50" width="80" height="56" rx="12" fill="url(#bnFront)" stroke="#3A4258" stroke-width="1.5"/>
      <path d="M56 69 L56 87 Q56 91 59.55 89.16 L77.45 79.84 Q81 78 77.45 76.16 L59.55 66.84 Q56 65 56 69 Z"
            fill="url(#bnEq)" filter="url(#bnGlow)"/>
    </g>
    <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="url(#bnTileBorder)" stroke-width="2.5"/>
  </g>

  <text x="192" y="176"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-1.5" fill="#F1F5F9">DJ Assistant</text>

  <text x="192" y="219"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400" fill="#94A3B8">Turn a music library into a performance-ready DJ set.</text>

  <text x="194" y="256"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="15" font-weight="500" letter-spacing="2" fill="#60A5FA">IMPORT · ANALYZE · CLEAN · CUE · SEQUENCE · EXPORT</text>

  <rect x="0.5" y="0.5" width="1279" height="319" rx="24" fill="none" stroke="url(#bnBorder)"/>
</svg>