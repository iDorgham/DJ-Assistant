<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="DJ Assistant">
  <title>DJ Assistant</title>
  <!-- Light variant of the Groove Meter mark: same geometry as logo.svg,
       light tile palette and a softer glow. -->
  <defs>
    <linearGradient id="llBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEF6"/>
    </linearGradient>
    <linearGradient id="llBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE3EE"/>
      <stop offset="1" stop-color="#C4CFE0"/>
    </linearGradient>
    <linearGradient id="llEq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="llGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="glowWide"/>
      <feComponentTransfer in="glowWide" result="glowSoft">
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="glowTight"/>
      <feMerge>
        <feMergeNode in="glowSoft"/>
        <feMergeNode in="glowTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="llClip">
      <rect x="1.5" y="1.5" width="125" height="125" rx="30"/>
    </clipPath>
  </defs>
  <rect x="1.5" y="1.5" width="125" height="125" rx="30" fill="url(#llBg)"/>
  <g clip-path="url(#llClip)">
    <g fill="none" stroke="#C4CFE0" stroke-width="1.5">
      <circle cx="64" cy="96" r="26"/>
      <circle cx="64" cy="96" r="20"/>
      <circle cx="64" cy="96" r="14"/>
    </g>
    <path d="M44.08 107.5A23 23 0 0 0 83.92 107.5" fill="none" stroke="#2563EB" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
    <circle cx="64" cy="96" r="3" fill="url(#llEq)"/>
    <g filter="url(#llGlow)">
      <g fill="url(#llEq)">
        <rect x="18" y="62" width="8" height="26" rx="4"/>
        <rect x="32" y="46" width="8" height="42" rx="4"/>
        <rect x="46" y="30" width="8" height="58" rx="4"/>
        <rect x="60" y="14" width="8" height="74" rx="4"/>
        <rect x="74" y="30" width="8" height="58" rx="4"/>
        <rect x="88" y="46" width="8" height="42" rx="4"/>
        <rect x="102" y="62" width="8" height="26" rx="4"/>
      </g>
      <g fill="#06B6D4">
        <rect x="18" y="55" width="8" height="4" rx="2"/>
        <rect x="32" y="39" width="8" height="4" rx="2"/>
        <rect x="46" y="23" width="8" height="4" rx="2"/>
        <rect x="60" y="7" width="8" height="4" rx="2"/>
        <rect x="74" y="23" width="8" height="4" rx="2"/>
        <rect x="88" y="39" width="8" height="4" rx="2"/>
        <rect x="102" y="55" width="8" height="4" rx="2"/>
      </g>
    </g>
  </g>
  <rect x="1.5" y="1.5" width="125" height="125" rx="30" fill="none" stroke="url(#llBorder)" stroke-width="3"/>
</svg>