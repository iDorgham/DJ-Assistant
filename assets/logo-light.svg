<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="DJ Assistant">
  <title>DJ Assistant</title>
  <!-- The Stack, light cut. Geometry is mirrored by scripts/make_icon.py. -->
  <defs>
    <linearGradient id="logoLightBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEF6"/>
    </linearGradient>
    <linearGradient id="logoLightBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE3EE"/>
      <stop offset="1" stop-color="#C4CFE0"/>
    </linearGradient>
    <linearGradient id="logoLightFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F7FB"/>
    </linearGradient>
    <linearGradient id="logoLightPlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="logoLightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="glowWide"/>
      <feComponentTransfer in="glowWide" result="glowSoft">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glowSoft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="logoLightClip">
      <rect x="8" y="8" width="112" height="112" rx="26"/>
    </clipPath>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#logoLightBg)"/>
  <g clip-path="url(#logoLightClip)">
    <rect x="42" y="24" width="44" height="20" rx="9" fill="#DCE3EE"/>
    <rect x="33" y="36" width="62" height="26" rx="10" fill="#C4CFE0"/>
    <rect x="24" y="50" width="80" height="56" rx="12" fill="url(#logoLightFront)" stroke="#C4CFE0" stroke-width="1.5"/>
    <path d="M56 69 L56 87 Q56 91 59.55 89.16 L77.45 79.84 Q81 78 77.45 76.16 L59.55 66.84 Q56 65 56 69 Z"
          fill="url(#logoLightPlay)" filter="url(#logoLightGlow)"/>
  </g>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="url(#logoLightBorder)" stroke-width="2.5"/>
</svg>