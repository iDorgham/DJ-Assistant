<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="DJ Assistant — your library in, a set out, nothing leaves your machine">
  <title>DJ Assistant</title>
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="1" stop-color="#161A24"/>
    </linearGradient>
    <radialGradient id="spRadialA" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spRadialB" cx="0.5" cy="1" r="0.8">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3040"/>
      <stop offset="1" stop-color="#171B25"/>
    </linearGradient>
    <linearGradient id="spTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171B25"/>
      <stop offset="1" stop-color="#0A0C11"/>
    </linearGradient>
    <linearGradient id="spSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spTileBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E344A"/>
      <stop offset="1" stop-color="#1A1F2B"/>
    </linearGradient>
    <linearGradient id="spFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3145"/>
      <stop offset="1" stop-color="#1A1F2B"/>
    </linearGradient>
    <linearGradient id="spEq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CE1FF"/>
      <stop offset="1" stop-color="#0090FF"/>
    </linearGradient>
    <filter id="spGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="glowWide"/>
      <feComponentTransfer in="glowWide" result="glowSoft">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="glowTight"/>
      <feMerge>
        <feMergeNode in="glowSoft"/>
        <feMergeNode in="glowTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="spTileClip">
      <rect x="8" y="8" width="112" height="112" rx="26"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" rx="32" fill="url(#spBg)"/>
  <rect width="1280" height="640" rx="32" fill="url(#spRadialA)"/>
  <rect width="1280" height="640" rx="32" fill="url(#spRadialB)"/>

  <!-- Flanking motifs: faint oversized Stacks -->
  <g opacity="0.15">
    <g transform="translate(110 190) scale(1.7)">
      <rect x="42" y="24" width="44" height="20" rx="9" fill="none" stroke="url(#spEq)" stroke-width="1"/>
      <rect x="33" y="36" width="62" height="26" rx="10" fill="none" stroke="url(#spEq)" stroke-width="1"/>
      <rect x="24" y="50" width="80" height="56" rx="12" fill="none" stroke="url(#spEq)" stroke-width="1"/>
      <path d="M56 69 L56 87 Q56 91 59.55 89.16 L77.45 79.84 Q81 78 77.45 76.16 L59.55 66.84 Q56 65 56 69 Z" fill="url(#spEq)"/>
    </g>
    <g transform="translate(950 190) scale(1.7)">
      <rect x="42" y="24" width="44" height="20" rx="9" fill="none" stroke="url(#spEq)" stroke-width="1"/>
      <rect x="33" y="36" width="62" height="26" rx="10" fill="none" stroke="url(#spEq)" stroke-width="1"/>
      <rect x="24" y="50" width="80" height="56" rx="12" fill="none" stroke="url(#spEq)" stroke-width="1"/>
      <path d="M56 69 L56 87 Q56 91 59.55 89.16 L77.45 79.84 Q81 78 77.45 76.16 L59.55 66.84 Q56 65 56 69 Z" fill="url(#spEq)"/>
    </g>
  </g>

  <!-- Centered app tile -->
  <g transform="translate(544 120) scale(1.5)">
    <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#spTile)"/>
    <rect x="8" y="8" width="112" height="112" fill="url(#spSheen)" clip-path="url(#spTileClip)"/>
    <g clip-path="url(#spTileClip)">
      <rect x="42" y="24" width="44" height="20" rx="9" fill="#232939"/>
      <rect x="33" y="36" width="62" height="26" rx="10" fill="#2E344A"/>
      <rect x="24" y="50" width="80" height="56" rx="12" fill="url(#spFront)" stroke="#3A4258" stroke-width="1.5"/>
      <path d="M56 69 L56 87 Q56 91 59.55 89.16 L77.45 79.84 Q81 78 77.45 76.16 L59.55 66.84 Q56 65 56 69 Z"
            fill="url(#spEq)" filter="url(#spGlow)"/>
    </g>
    <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="url(#spTileBorder)" stroke-width="2.5"/>
  </g>

  <text x="640" y="408" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="68" font-weight="700" letter-spacing="-2" fill="#F1F5F9">DJ Assistant</text>

  <text x="640" y="456" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" fill="#94A3B8">Your library in. A set out. Nothing leaves your machine.</text>

  <text x="640" y="516" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="16" font-weight="500" letter-spacing="3" fill="#60A5FA">LOCAL-FIRST · NON-DESTRUCTIVE · REVERSIBLE · TRANSPARENT</text>

  <rect x="0.5" y="0.5" width="1279" height="639" rx="32" fill="none" stroke="url(#spBorder)"/>
</svg>