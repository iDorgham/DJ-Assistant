<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="DJ Assistant — local-first, non-destructive DJ set preparation">
  <title>DJ Assistant</title>
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="1" stop-color="#161A24"/>
    </linearGradient>
    <radialGradient id="spRadialA" cx="0.5" cy="0.06" r="0.7">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spRadialB" cx="0.5" cy="1" r="0.8">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171B25"/>
      <stop offset="1" stop-color="#0A0C11"/>
    </linearGradient>
    <linearGradient id="spSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spTileBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E344A"/>
      <stop offset="1" stop-color="#1A1F2B"/>
    </linearGradient>
    <linearGradient id="spEq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CE1FF"/>
      <stop offset="1" stop-color="#0090FF"/>
    </linearGradient>
    <linearGradient id="spFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="spMotifMask">
      <rect x="180" y="0" width="920" height="640" fill="url(#spFade)"/>
    </mask>
    <filter id="spGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="glowWide"/>
      <feComponentTransfer in="glowWide" result="glowSoft">
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="glowTight"/>
      <feMerge>
        <feMergeNode in="glowSoft"/>
        <feMergeNode in="glowTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="spTileClip">
      <rect x="1.5" y="1.5" width="125" height="125" rx="30"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#spBg)"/>
  <rect width="1280" height="640" fill="url(#spRadialA)"/>
  <rect width="1280" height="640" fill="url(#spRadialB)"/>

  <!-- EQ bars flanking the lockup -->
  <g fill="url(#spEq)" opacity="0.14" mask="url(#spMotifMask)">
    <rect x="248" y="300" width="12" height="40" rx="6"/>
    <rect x="272" y="284" width="12" height="72" rx="6"/>
    <rect x="296" y="264" width="12" height="112" rx="6"/>
    <rect x="320" y="296" width="12" height="48" rx="6"/>
    <rect x="960" y="296" width="12" height="48" rx="6"/>
    <rect x="984" y="264" width="12" height="112" rx="6"/>
    <rect x="1008" y="284" width="12" height="72" rx="6"/>
    <rect x="1032" y="300" width="12" height="40" rx="6"/>
  </g>

  <!-- Centered lockup -->
  <g transform="translate(560 96) scale(1.25)">
    <rect x="1.5" y="1.5" width="125" height="125" rx="30" fill="url(#spTile)"/>
    <rect x="1.5" y="1.5" width="125" height="125" fill="url(#spSheen)" clip-path="url(#spTileClip)"/>
    <g fill="url(#spEq)" filter="url(#spGlow)">
      <rect x="18" y="51" width="8" height="26" rx="4"/>
      <rect x="32" y="41" width="8" height="46" rx="4"/>
      <rect x="46" y="30" width="8" height="68" rx="4"/>
      <rect x="60" y="20" width="8" height="88" rx="4"/>
      <rect x="74" y="30" width="8" height="68" rx="4"/>
      <rect x="88" y="41" width="8" height="46" rx="4"/>
      <rect x="102" y="51" width="8" height="26" rx="4"/>
    </g>
    <rect x="1.5" y="1.5" width="125" height="125" rx="30" fill="none" stroke="url(#spTileBorder)" stroke-width="3"/>
  </g>

  <text x="640" y="386" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="-2" fill="#F1F5F9">DJ Assistant</text>

  <text x="640" y="440" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" fill="#94A3B8">Turn a music library into a performance-ready DJ set.</text>

  <text x="640" y="502" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="18" font-weight="500" letter-spacing="3" fill="#60A5FA">ANALYZE · CLEAN · CUE · SEQUENCE · EXPORT</text>

  <rect x="480" y="546" width="320" height="1" fill="#232A38"/>

  <text x="640" y="586" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="400" fill="#64748B">Local-first · Non-destructive · Offline by default</text>
</svg>
