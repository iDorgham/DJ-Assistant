<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="DJ Assistant">
  <title>DJ Assistant</title>
  <defs>
    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171B25"/>
      <stop offset="1" stop-color="#0A0C11"/>
    </linearGradient>
    <linearGradient id="logoSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logoBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E344A"/>
      <stop offset="1" stop-color="#1A1F2B"/>
    </linearGradient>
    <linearGradient id="logoEq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CE1FF"/>
      <stop offset="1" stop-color="#0090FF"/>
    </linearGradient>
    <filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="glowWide"/>
      <feComponentTransfer in="glowWide" result="glowSoft">
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="glowTight"/>
      <feMerge>
        <feMergeNode in="glowSoft"/>
        <feMergeNode in="glowTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="logoClip">
      <rect x="1.5" y="1.5" width="125" height="125" rx="30"/>
    </clipPath>
  </defs>
  <rect x="1.5" y="1.5" width="125" height="125" rx="30" fill="url(#logoBg)"/>
  <rect x="1.5" y="1.5" width="125" height="125" fill="url(#logoSheen)" clip-path="url(#logoClip)"/>
  <g fill="url(#logoEq)" filter="url(#logoGlow)">
    <rect x="18" y="51" width="8" height="26" rx="4"/>
    <rect x="32" y="41" width="8" height="46" rx="4"/>
    <rect x="46" y="30" width="8" height="68" rx="4"/>
    <rect x="60" y="20" width="8" height="88" rx="4"/>
    <rect x="74" y="30" width="8" height="68" rx="4"/>
    <rect x="88" y="41" width="8" height="46" rx="4"/>
    <rect x="102" y="51" width="8" height="26" rx="4"/>
  </g>
  <rect x="1.5" y="1.5" width="125" height="125" rx="30" fill="none" stroke="url(#logoBorder)" stroke-width="3"/>
</svg>
