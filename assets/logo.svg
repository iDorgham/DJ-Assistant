<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="DJ Assistant">
  <title>DJ Assistant</title>
  <!-- The Stack: three rounded library tiles in perspective with a play
       triangle on the front. Geometry is mirrored by scripts/make_icon.py. -->
  <defs>
    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171B25"/>
      <stop offset="1" stop-color="#0A0C11"/>
    </linearGradient>
    <linearGradient id="logoSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logoBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E344A"/>
      <stop offset="1" stop-color="#1A1F2B"/>
    </linearGradient>
    <linearGradient id="logoFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3145"/>
      <stop offset="1" stop-color="#1A1F2B"/>
    </linearGradient>
    <linearGradient id="logoPlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CE1FF"/>
      <stop offset="1" stop-color="#0090FF"/>
    </linearGradient>
    <filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="glowWide"/>
      <feComponentTransfer in="glowWide" result="glowSoft">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="glowTight"/>
      <feMerge>
        <feMergeNode in="glowSoft"/>
        <feMergeNode in="glowTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="logoClip">
      <rect x="8" y="8" width="112" height="112" rx="26"/>
    </clipPath>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#logoBg)"/>
  <rect x="8" y="8" width="112" height="112" fill="url(#logoSheen)" clip-path="url(#logoClip)"/>
  <g clip-path="url(#logoClip)">
    <rect x="42" y="24" width="44" height="20" rx="9" fill="#232939"/>
    <rect x="33" y="36" width="62" height="26" rx="10" fill="#2E344A"/>
    <rect x="24" y="50" width="80" height="56" rx="12" fill="url(#logoFront)" stroke="#3A4258" stroke-width="1.5"/>
    <path d="M56 69 L56 87 Q56 91 59.55 89.16 L77.45 79.84 Q81 78 77.45 76.16 L59.55 66.84 Q56 65 56 69 Z"
          fill="url(#logoPlay)" filter="url(#logoGlow)"/>
  </g>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="url(#logoBorder)" stroke-width="2.5"/>
</svg>