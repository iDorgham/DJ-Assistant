<svg xmlns="http://www.w3.org/2000/svg" width="364" height="80" viewBox="0 0 364 80" role="img" aria-label="DJ Assistant">
  <title>DJ Assistant</title>
  <defs>
    <linearGradient id="wmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171B25"/>
      <stop offset="1" stop-color="#0A0C11"/>
    </linearGradient>
    <linearGradient id="wmSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wmBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E344A"/>
      <stop offset="1" stop-color="#1A1F2B"/>
    </linearGradient>
    <linearGradient id="wmFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3145"/>
      <stop offset="1" stop-color="#1A1F2B"/>
    </linearGradient>
    <linearGradient id="wmPlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CE1FF"/>
      <stop offset="1" stop-color="#0090FF"/>
    </linearGradient>
    <filter id="wmGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="glowWide"/>
      <feComponentTransfer in="glowWide" result="glowSoft">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="glowTight"/>
      <feMerge>
        <feMergeNode in="glowSoft"/>
        <feMergeNode in="glowTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="wmClip">
      <rect x="8" y="8" width="112" height="112" rx="26"/>
    </clipPath>
  </defs>
  <g transform="translate(8 8) scale(0.5)">
    <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#wmBg)"/>
    <rect x="8" y="8" width="112" height="112" fill="url(#wmSheen)" clip-path="url(#wmClip)"/>
    <g clip-path="url(#wmClip)">
      <rect x="42" y="24" width="44" height="20" rx="9" fill="#232939"/>
      <rect x="33" y="36" width="62" height="26" rx="10" fill="#2E344A"/>
      <rect x="24" y="50" width="80" height="56" rx="12" fill="url(#wmFront)" stroke="#3A4258" stroke-width="1.5"/>
      <path d="M56 69 L56 87 Q56 91 59.55 89.16 L77.45 79.84 Q81 78 77.45 76.16 L59.55 66.84 Q56 65 56 69 Z"
            fill="url(#wmPlay)" filter="url(#wmGlow)"/>
    </g>
    <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="url(#wmBorder)" stroke-width="2.5"/>
  </g>
  <text x="88" y="53"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="38" font-weight="700" letter-spacing="-1"
        textLength="252" lengthAdjust="spacing"
        fill="#F1F5F9">DJ Assistant</text>
</svg>