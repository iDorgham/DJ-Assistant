name: Nightly Audit

# Weekly dependency/security audit, gating on advisories (T0.1.15).
#
#   * `pnpm audit --prod --audit-level=high` fails on high/critical advisories
#     in production (non-dev) JS dependencies.
#   * `cargo audit` fails on any RustSec *vulnerability*. The RustSec advisory
#     format has no CVSS severity, so "any vulnerability" is the strictest
#     available gate; non-vulnerability warnings (`unmaintained`, `unsound`)
#     are reported but do not fail the job.
#
# Run it manually from the Actions tab ("Run workflow") after a dependency bump.
on:
  schedule:
    # Mondays at 09:00 UTC (weekly)
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-audit-${{ github.workflow }}
  cancel-in-progress: true

# All actions are pinned to full-length commit SHAs because the repository
# enforces "Require actions to be pinned to a full-length commit SHA".
jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (production dependencies, high/critical)
        run: pnpm audit --prod --audit-level=high

      - name: Install cargo-audit
        # Prebuilt binary; avoids compiling cargo-audit on every run.
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-audit

      - name: cargo audit (workspace lockfile)
        # Cargo.lock lives at the workspace root. Advisory severity has no
        # high/critical split, so this fails on any vulnerability.
        run: cargo audit
