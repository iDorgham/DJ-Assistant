name: Nightly Audit

# Weekly dependency/security audit, gating on advisories (T0.1.15).
#
#   * `pnpm audit --prod --audit-level=high` fails on high/critical advisories
#     in production (non-dev) JS dependencies.
#   * `cargo audit` fails on any RustSec *vulnerability*. The RustSec advisory
#     format has no CVSS severity, so "any vulnerability" is the strictest
#     available gate; non-vulnerability warnings (`unmaintained`, `unsound`)
#     are reported but do not fail the job.
#
# Run it manually from the Actions tab ("Run workflow") after a dependency bump.
on:
  schedule:
    # Mondays at 09:00 UTC (weekly)
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-audit-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        # Version comes from package.json "packageManager" (single source of truth).
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (production dependencies, high/critical)
        run: pnpm audit --prod --audit-level=high

      - name: Install cargo-audit
        # Prebuilt binary; avoids compiling cargo-audit on every run.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (workspace lockfile)
        # Cargo.lock lives at the workspace root. Advisory severity has no
        # high/critical split, so this fails on any vulnerability.
        run: cargo audit
