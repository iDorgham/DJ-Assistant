name: Desktop Build

# Reusable workflow: compiles the Tauri desktop app on both supported desktop
# platforms (macOS + Windows). Called from PR CI and Main CI.
on:
  workflow_call:

# All actions are pinned to full-length commit SHAs because the repository
# enforces "Require actions to be pinned to a full-length commit SHA".
jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        # Version comes from package.json "packageManager" (single source of truth).
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install JS
        run: pnpm install --frozen-lockfile

      # `tauri::generate_context!` embeds the frontend bundle at compile time,
      # so the web assets must be built before `cargo build`.
      - name: Build frontend
        run: pnpm build:desktop

      - name: Build desktop app (Rust)
        run: cargo build --locked -p dj-assistant-desktop
