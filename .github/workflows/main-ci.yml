name: Main CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-ci
  cancel-in-progress: true

jobs:
  # Detect which parts of the repo changed so downstream jobs can skip
  # themselves cheaply. Desktop Build on macOS costs 10× Linux minutes.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      tauri: ${{ steps.filter.outputs.tauri }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch enough history for the diff to compare against the previous push.
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tests/**'
              - 'apps/desktop/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            tauri:
              - 'apps/desktop/src-tauri/**'
              - 'apps/desktop/src/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/package.json'
              - 'packages/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  full-validate:
    name: Full Validate
    runs-on: ubuntu-latest
    needs: changes
    # Always run JS checks. Skip Rust steps when no Rust files changed.
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rust == 'true'
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        if: needs.changes.outputs.rust == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install JS
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies (Tauri)
        if: needs.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libxdo-dev libssl-dev librsvg2-dev patchelf

      - name: Lint / typecheck / test JS
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Rust checks
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  desktop-build:
    name: Desktop Build (macOS + Windows)
    needs: changes
    # Only compile Tauri on main when Tauri/frontend source actually changed.
    if: needs.changes.outputs.tauri == 'true'
    uses: ./.github/workflows/desktop-build.yml
