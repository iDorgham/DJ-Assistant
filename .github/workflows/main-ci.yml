name: Main CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-ci
  cancel-in-progress: true

jobs:
  full-validate:
    name: Full Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from package.json "packageManager" (single source of truth).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install JS
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libxdo-dev libssl-dev librsvg2-dev patchelf

      - name: Lint / typecheck / test JS
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Rust checks
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  desktop-build:
    name: Desktop Build (macOS + Windows)
    uses: ./.github/workflows/desktop-build.yml
