name: Main CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-ci
  cancel-in-progress: true

# All actions are pinned to full-length commit SHAs because the repository
# enforces "Require actions to be pinned to a full-length commit SHA".
# Keep the trailing version comments in sync so Dependabot can bump them.
jobs:
  # Detect which parts of the repo changed so downstream jobs can skip
  # themselves cheaply. Desktop Build on macOS costs 10× Linux minutes.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      tauri: ${{ steps.filter.outputs.tauri }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch enough history for the diff to compare against the previous push.
          fetch-depth: 2
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tests/**'
              - 'apps/desktop/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            tauri:
              - 'apps/desktop/src-tauri/**'
              - 'apps/desktop/src/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/package.json'
              - 'packages/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  full-validate:
    name: Full Validate
    runs-on: ubuntu-latest
    needs: changes
    # Always run JS checks. Skip Rust steps when no Rust files changed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: needs.changes.outputs.rust == 'true'
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        if: needs.changes.outputs.rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install JS
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies (Tauri)
        if: needs.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libxdo-dev libssl-dev librsvg2-dev patchelf

      - name: Lint / typecheck / test JS
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Rust checks
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  desktop-build:
    name: Desktop Build (macOS + Windows)
    needs: changes
    # Only compile Tauri on main when Tauri/frontend source actually changed.
    if: needs.changes.outputs.tauri == 'true'
    uses: ./.github/workflows/desktop-build.yml
