name: PR CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  js-lint-test:
    name: JS/TS Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  # Detect which parts of the repo changed so downstream jobs can skip
  # themselves cheaply without burning macOS/Windows runner minutes.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      tauri: ${{ steps.filter.outputs.tauri }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tests/**'
              - 'apps/desktop/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            tauri:
              - 'apps/desktop/src-tauri/**'
              - 'apps/desktop/src/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/package.json'
              - 'packages/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  rust-lint-test:
    name: Rust Fmt, Clippy, Test
    runs-on: ubuntu-latest
    needs: changes
    # Skip entirely when no Rust files changed (e.g. pure JS or docs PRs).
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libxdo-dev libssl-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        # Portable subset: skips desktop integration tests that require
        # a full Tauri/WebKit stack. Keeps CI fast on ubuntu-latest.
        run: cargo test -p dj-assistant-core -p dj-assistant-analysis -p dj-assistant-schema-tests

  desktop-build:
    name: Desktop Build (macOS + Windows)
    needs: changes
    # Only run the expensive cross-platform build when Tauri/frontend files
    # changed AND this is not a Dependabot PR (dep bumps are verified by
    # rust-lint-test + js-lint-test; a full native compile is unnecessary).
    if: |
      needs.changes.outputs.tauri == 'true' &&
      github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/desktop-build.yml
