name: PR CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# All actions are pinned to full-length commit SHAs because the repository
# enforces "Require actions to be pinned to a full-length commit SHA".
# Keep the trailing version comments in sync so Dependabot can bump them.
jobs:
  js-lint-test:
    name: JS/TS Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  # Detect which parts of the repo changed so downstream jobs can skip
  # themselves cheaply without burning macOS/Windows runner minutes.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      tauri: ${{ steps.filter.outputs.tauri }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tests/**'
              - 'apps/desktop/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            tauri:
              - 'apps/desktop/src-tauri/**'
              - 'apps/desktop/src/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/package.json'
              - 'packages/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  rust-lint-test:
    name: Rust Fmt, Clippy, Test
    runs-on: ubuntu-latest
    needs: changes
    # Skip entirely when no Rust files changed (e.g. pure JS or docs PRs).
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libxdo-dev libssl-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        # Portable subset: skips desktop integration tests that require
        # a full Tauri/WebKit stack. Keeps CI fast on ubuntu-latest.
        run: cargo test -p dj-assistant-core -p dj-assistant-analysis -p dj-assistant-schema-tests

  desktop-build:
    name: Desktop Build (macOS + Windows)
    needs: changes
    # Only run the expensive cross-platform build when Tauri/frontend files
    # changed AND this is not a Dependabot PR (dep bumps are verified by
    # rust-lint-test + js-lint-test; a full native compile is unnecessary).
    if: |
      needs.changes.outputs.tauri == 'true' &&
      github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/desktop-build.yml
